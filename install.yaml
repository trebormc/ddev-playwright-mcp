name: ddev-playwright-mcp

ddev_version_constraint: '>= v1.24.10'

dependencies: []

pre_install_actions:
  - |
    #ddev-description:Preparing Playwright MCP installation
    echo "Installing ddev-playwright-mcp add-on..."

project_files:
  - docker-compose.playwright-mcp.yaml

global_files: []

post_install_actions:
  - |
    #ddev-description:Creating screenshots directory
    # post_install_actions run inside .ddev/: the output directory lives in the
    # project root. Creating it here, as the host user, means Docker never has
    # to create it (which it would do as root).
    mkdir -p ../screenshots
    # Earlier releases created .ddev/screenshots by mistake; drop it when empty.
    rmdir screenshots 2>/dev/null || true

removal_actions:
  - |
    #ddev-description:Cleaning up Playwright MCP
    echo "Playwright MCP add-on removed."
